name: khurpi_fresh
description: Khurpi Fresh - Veg & Fruit Shop Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management - Riverpod
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2
  
  # HTTP & API - Retrofit
  dio: 5.9.0
  retrofit: '>=4.0.0 <5.0.0'
  json_annotation: 4.11.0
  
  # Local Storage
  shared_preferences: 2.5.3
  
  # Functional Programming
  dartz: ^0.10.1
  freezed_annotation: 3.1.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: 3.0.0
  flutter_svg: ^2.0.16
  badges: ^3.1.2
  
  # Location & Maps
  geolocator: 13.0.4
  geocoding: 3.0.0
  
  # Utils
  intl: any
  url_launcher: 6.3.2
  equatable: ^2.0.7
  
  # Icons
  flutter_iconly: ^1.0.2

  # Internationalization
  flutter_localizations:
    sdk: flutter

dependency_overrides:
  analyzer: 9.0.0
  dart_style: 3.1.3

dev_dependencies:
  flutter_lints: 3.0.2
  build_runner: 2.13.1
  freezed: 3.2.5
  json_serializable: 6.13.0
  retrofit_generator: '>=10.2.3'
  riverpod_generator: 4.0.3
  mockito: 5.6.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
